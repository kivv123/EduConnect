<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Your Email - EduConnect</title>
  <meta name="description" content="Verify your email address with the 6-digit code sent to your inbox." />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/educonnect/assets/css/style.css" />
  <link rel="stylesheet" href="/educonnect/assets/css/responsive.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-edu" id="edu-main-nav"></nav>

  <main class="py-5">
    <div class="container" style="max-width: 480px;">
      <div class="card-edu p-4 p-md-5 text-center">
        <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.4rem;">✉️</div>
        <h3 class="fw-bold mb-2">Check Your Inbox</h3>
        <p class="text-secondary small mb-1">We sent a 6-digit verification code to:</p>
        <p class="fw-semibold text-primary mb-4" id="display-email">loading...</p>

        <form id="edu-verify-form">
          <input type="hidden" id="verify-email" />
          
          <label class="form-label-edu text-start">Enter 6-digit verification code</label>
          <div class="otp-input-group">
            <input type="text" maxlength="1" class="otp-digit" pattern="[0-9]" inputmode="numeric" required autofocus />
            <input type="text" maxlength="1" class="otp-digit" pattern="[0-9]" inputmode="numeric" required />
            <input type="text" maxlength="1" class="otp-digit" pattern="[0-9]" inputmode="numeric" required />
            <input type="text" maxlength="1" class="otp-digit" pattern="[0-9]" inputmode="numeric" required />
            <input type="text" maxlength="1" class="otp-digit" pattern="[0-9]" inputmode="numeric" required />
            <input type="text" maxlength="1" class="otp-digit" pattern="[0-9]" inputmode="numeric" required />
          </div>

          <button type="submit" class="btn-edu-primary w-100 mb-3">Verify Email</button>
        </form>

        <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top small text-muted">
          <span>Didn't receive the code?</span>
          <button type="button" id="resend-code-btn" class="btn btn-link btn-sm text-decoration-none">Resend Code</button>
        </div>
      </div>
    </div>
  </main>

  <div id="edu-toast-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/educonnect/assets/js/api.js"></script>
  <script src="/educonnect/assets/js/auth.js"></script>
</body>
</html>
