<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password - EduConnect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/educonnect/assets/css/style.css" />
  <link rel="stylesheet" href="/educonnect/assets/css/responsive.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-edu" id="edu-main-nav"></nav>

  <main class="py-5">
    <div class="container" style="max-width: 440px;">
      <div class="card-edu p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="brand-icon mx-auto mb-3" style="width: 44px; height: 44px; font-size: 1.3rem;">🔑</div>
          <h3 class="fw-bold mb-1">Reset Password</h3>
          <p class="text-secondary small">Enter your email and we'll send a 6-digit reset code.</p>
        </div>

        <form id="edu-forgot-form">
          <div class="mb-4">
            <label class="form-label-edu" for="forgot-email">Registered Email Address</label>
            <input type="email" id="forgot-email" class="form-control-edu" placeholder="name@example.com" required autofocus />
          </div>

          <button type="submit" class="btn-edu-primary w-100 mb-3">Send Reset Code</button>

          <div class="text-center small text-muted">
            Remembered your password? <a href="/educonnect/login.html">Back to Sign In</a>
          </div>
        </form>
      </div>
    </div>
  </main>

  <div id="edu-toast-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/educonnect/assets/js/api.js"></script>
  <script src="/educonnect/assets/js/auth.js"></script>
</body>
</html>
