<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account - EduConnect</title>
  <meta name="description" content="Register as a learner or provider on the EduConnect platform." />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/educonnect/assets/css/style.css" />
  <link rel="stylesheet" href="/educonnect/assets/css/responsive.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-edu" id="edu-main-nav"></nav>

  <main class="py-5">
    <div class="container" style="max-width: 480px;">
      <div class="card-edu p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="brand-icon mx-auto mb-3" style="width: 44px; height: 44px; font-size: 1.3rem;">E</div>
          <h3 class="fw-bold mb-1">Create an Account</h3>
          <p class="text-secondary small">Join thousands of students and global academic providers</p>
        </div>

        <form id="edu-register-form">
          <div class="mb-3">
            <label class="form-label-edu" for="reg-role">I am registering as *</label>
            <select id="reg-role" class="form-select-edu" required>
              <option value="learner" selected>Learner / Student (Apply for opportunities & build portfolio)</option>
              <option value="provider">Provider (Publish opportunities & review applications)</option>
            </select>
          </div>

          <div class="mb-3" id="provider-type-group" style="display: none;">
            <label class="form-label-edu" for="reg-provider-type">Provider Classification *</label>
            <select id="reg-provider-type" class="form-select-edu">
              <option value="university">University / Higher Education Institution</option>
              <option value="organization">Educational NGO / Corporate Foundation</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label-edu" for="reg-name">Full Name or Institution Legal Name *</label>
            <input type="text" id="reg-name" class="form-control-edu" placeholder="e.g. Jane Doe or University Admissions" required />
          </div>

          <div class="mb-3">
            <label class="form-label-edu" for="reg-email">Email Address *</label>
            <input type="email" id="reg-email" class="form-control-edu" placeholder="name@example.com" required />
            <span class="small text-muted">A 6-digit email verification code will be sent to this address.</span>
          </div>

          <div class="mb-3">
            <label class="form-label-edu" for="reg-phone">Contact Phone Number (Optional)</label>
            <input type="tel" id="reg-phone" class="form-control-edu" placeholder="+1 555-0199" />
          </div>

          <div class="mb-4">
            <label class="form-label-edu" for="reg-password">Password *</label>
            <input type="password" id="reg-password" class="form-control-edu" placeholder="Minimum 6 characters" required minlength="6" />
          </div>

          <button type="submit" class="btn-edu-primary w-100 mb-3">Continue to Email Verification</button>

          <div class="text-center small text-muted">
            Already have an account? <a href="/educonnect/login.html">Sign In</a>
          </div>
        </form>
      </div>
    </div>
  </main>

  <div id="edu-toast-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/educonnect/assets/js/api.js"></script>
  <script src="/educonnect/assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      EduApi.renderNav('register');
    });
  </script>
</body>
</html>
