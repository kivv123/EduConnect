<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - EduConnect</title>
  <meta name="description" content="Sign in to your EduConnect learner, provider, or administrator account." />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/educonnect/assets/css/style.css" />
  <link rel="stylesheet" href="/educonnect/assets/css/responsive.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-edu" id="edu-main-nav"></nav>

  <main class="py-5">
    <div class="container" style="max-width: 440px;">
      <div class="card-edu p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="brand-icon mx-auto mb-3" style="width: 44px; height: 44px; font-size: 1.3rem;">E</div>
          <h3 class="fw-bold mb-1">Welcome Back</h3>
          <p class="text-secondary small">Sign in to your EduConnect account</p>
        </div>

        <form id="edu-login-form">
          <div class="mb-3">
            <label class="form-label-edu" for="login-email">Email Address</label>
            <input type="email" id="login-email" class="form-control-edu" placeholder="name@example.com" required autofocus />
          </div>

          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label class="form-label-edu m-0" for="login-password">Password</label>
              <a href="/educonnect/forgot_password.html" class="small text-decoration-none">Forgot password?</a>
            </div>
            <input type="password" id="login-password" class="form-control-edu" placeholder="••••••••" required />
          </div>

          <button type="submit" class="btn-edu-primary w-100 mb-3">Sign In</button>

          <div class="text-center small text-muted">
            Don't have an account? <a href="/educonnect/register.html">Create an account</a>
          </div>
        </form>

        <hr class="my-4" />

        <div class="small text-muted text-center">
          <p class="mb-2 fw-semibold">Quick test logins:</p>
          <div class="d-flex flex-wrap gap-1 justify-content-center">
            <button class="btn btn-sm btn-light border" onclick="fillLogin('learner@educonnect.org', 'learner123')">Learner</button>
            <button class="btn btn-sm btn-light border" onclick="fillLogin('oxford@educonnect.org', 'provider123')">Provider</button>
            <button class="btn btn-sm btn-light border" onclick="fillLogin('admin@educonnect.org', 'admin123')">Admin</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="edu-toast-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/educonnect/assets/js/api.js"></script>
  <script src="/educonnect/assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      EduApi.renderNav('login');
    });
    function fillLogin(email, pwd) {
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = pwd;
    }
  </script>
</body>
</html>
