<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - EduConnect Platform</title>
  <meta name="description" content="Sign in to your EduConnect student, provider, or administrator account." />

  <!-- Bootstrap 5.3.3 CSS & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <!-- Platform Custom Styles -->
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <!-- Dynamic Navigation Bar -->
  <div id="mainNavbar"></div>

  <main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-5 col-md-8">
          
          <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white">
            <div class="card-body p-4 p-md-5">
              
              <div class="text-center mb-4">
                <div class="brand-logo-badge bg-primary text-white rounded-3 d-inline-flex align-items-center justify-content-center mb-3" style="width: 48px; height: 48px;">
                  <i class="bi bi-mortarboard-fill fs-4"></i>
                </div>
                <h4 class="fw-bold text-dark mb-1">Welcome to EduConnect</h4>
                <p class="text-secondary small mb-0">Sign in to your account or use the quick test personas below.</p>
              </div>

              <!-- Fast 1-Click Role Testing Buttons for Evaluation -->
              <div class="p-3 bg-light rounded-3 border mb-4">
                <div class="d-flex align-items-center justify-content-between mb-2">
                  <span class="text-xs fw-bold text-uppercase text-secondary tracking-wider">
                    <i class="bi bi-lightning-charge-fill text-warning me-1"></i>1-Click Test Credentials
                  </span>
                  <span class="badge bg-secondary bg-opacity-25 text-dark text-xs">Password: 123456</span>
                </div>
                <div class="d-grid gap-2">
                  <button type="button" class="btn btn-sm btn-outline-primary text-start d-flex align-items-center justify-content-between" onclick="fillCredentials('student@test.com', '123456')">
                    <span><i class="bi bi-mortarboard me-2"></i><strong>Student</strong> (Learner)</span>
                    <span class="text-xs text-muted">student@test.com</span>
                  </button>
                  <button type="button" class="btn btn-sm btn-outline-warning text-dark text-start d-flex align-items-center justify-content-between" onclick="fillCredentials('provider@test.com', '123456')">
                    <span><i class="bi bi-building me-2"></i><strong>Institution</strong> (Provider)</span>
                    <span class="text-xs text-muted">provider@test.com</span>
                  </button>
                  <button type="button" class="btn btn-sm btn-outline-danger text-start d-flex align-items-center justify-content-between" onclick="fillCredentials('admin@test.com', '123456')">
                    <span><i class="bi bi-shield-check me-2"></i><strong>Administrator</strong></span>
                    <span class="text-xs text-muted">admin@test.com</span>
                  </button>
                </div>
              </div>

              <!-- Error Alert -->
              <div id="loginErrorAlert" class="alert alert-danger d-none py-2 px-3 small" role="alert"></div>

              <!-- Login Form -->
              <form id="loginForm">
                <div class="mb-3">
                  <label for="loginEmail" class="form-label small fw-semibold text-dark">Email Address</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0">
                      <i class="bi bi-envelope"></i>
                    </span>
                    <input type="email" class="form-control border-start-0" id="loginEmail" placeholder="e.g. student@test.com" required />
                  </div>
                </div>

                <div class="mb-4">
                  <div class="d-flex justify-content-between align-items-center mb-1">
                    <label for="loginPassword" class="form-label small fw-semibold text-dark mb-0">Password</label>
                    <a href="#" class="text-xs text-primary text-decoration-none">Forgot password?</a>
                  </div>
                  <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0">
                      <i class="bi bi-lock"></i>
                    </span>
                    <input type="password" class="form-control border-start-0" id="loginPassword" placeholder="••••••••" required />
                  </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2.5 fw-semibold mb-3" id="loginSubmitBtn">
                  Sign In
                </button>
              </form>

              <div class="text-center small text-muted">
                Don't have an account yet? 
                <a href="register.html" class="text-primary fw-semibold text-decoration-none">Create Account</a>
              </div>

              <!-- Backend-Ready Developer Note -->
              <div class="mt-4 pt-3 border-top text-center text-xs text-secondary">
                <i class="bi bi-code-slash me-1"></i>Ready for PHP API: <code>/backend/api/auth/login.php</code>
              </div>

            </div>
          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- Dynamic Footer -->
  <div id="mainFooter"></div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Scripts -->
  <script src="./js/data/mock-users.js"></script>
  <script src="./js/data/mock-categories.js"></script>
  <script src="./js/data/mock-opportunities.js"></script>
  <script src="./js/data/mock-universities.js"></script>
  <script src="./js/data/mock-events.js"></script>
  <script src="./js/data/mock-applications.js"></script>

  <script src="./js/core/storage.js"></script>
  <script src="./js/core/config.js"></script>
  <script src="./js/core/router.js"></script>
  <script src="./js/services/auth-service.js"></script>
  <script src="./js/services/user-service.js"></script>
  <script src="./js/services/opportunity-service.js"></script>
  <script src="./js/services/university-service.js"></script>
  <script src="./js/services/event-service.js"></script>
  <script src="./js/services/application-service.js"></script>

  <script src="./js/core/app.js"></script>
  <script src="./js/auth/auth.js"></script>
</body>
</html>
