<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set New Password - EduConnect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/educonnect/assets/css/style.css" />
  <link rel="stylesheet" href="/educonnect/assets/css/responsive.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-edu" id="edu-main-nav"></nav>

  <main class="py-5">
    <div class="container" style="max-width: 440px;">
      <div class="card-edu p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="brand-icon mx-auto mb-3" style="width: 44px; height: 44px; font-size: 1.3rem;">🔒</div>
          <h3 class="fw-bold mb-1">Set New Password</h3>
          <p class="text-secondary small">Enter the 6-digit reset code sent to your email</p>
        </div>

        <form id="edu-reset-form">
          <div class="mb-3">
            <label class="form-label-edu" for="reset-email">Email Address</label>
            <input type="email" id="reset-email" class="form-control-edu" required />
          </div>

          <div class="mb-3">
            <label class="form-label-edu" for="reset-code">6-Digit Reset Code</label>
            <input type="text" id="reset-code" maxlength="6" class="form-control-edu fw-bold letter-spacing-1 text-center" placeholder="123456" required />
          </div>

          <div class="mb-3">
            <label class="form-label-edu" for="reset-password">New Password</label>
            <input type="password" id="reset-password" class="form-control-edu" placeholder="Minimum 6 characters" minlength="6" required />
          </div>

          <div class="mb-4">
            <label class="form-label-edu" for="reset-confirm-password">Confirm New Password</label>
            <input type="password" id="reset-confirm-password" class="form-control-edu" placeholder="Re-enter password" minlength="6" required />
          </div>

          <button type="submit" class="btn-edu-primary w-100 mb-3">Update Password</button>
        </form>
      </div>
    </div>
  </main>

  <div id="edu-toast-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/educonnect/assets/js/api.js"></script>
  <script src="/educonnect/assets/js/auth.js"></script>
</body>
</html>
