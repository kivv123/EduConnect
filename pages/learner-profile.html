<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Learner Portfolio - EduConnect</title>
  <meta name="description" content="Manage your academic background, skills, certifications, and portfolio items." />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/educonnect/assets/css/style.css" />
  <link rel="stylesheet" href="/educonnect/assets/css/responsive.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-edu" id="edu-main-nav"></nav>

  <main class="py-5">
    <div class="container" id="learner-portfolio-container">
      <div class="state-box">
        <div class="spinner-border text-primary mb-2" role="status"></div>
        <p class="text-muted m-0">Loading your profile and verified portfolio...</p>
      </div>
    </div>
  </main>

  <div id="edu-toast-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/educonnect/assets/js/api.js"></script>
  <script src="/educonnect/assets/js/learner-profile.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      EduLearnerProfile.init();
    });
  </script>
</body>
</html>
