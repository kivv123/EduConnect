<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Educational Opportunities - EduConnect</title>
  <meta name="description" content="Discover scholarships, fellowships, internships, seminars, and academic workshops worldwide." />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/educonnect/assets/css/style.css" />
  <link rel="stylesheet" href="/educonnect/assets/css/responsive.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-edu" id="edu-main-nav"></nav>

  <main class="py-5">
    <div class="container">
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-4 gap-3">
        <div>
          <h2 class="fw-bold m-0">Educational Opportunities</h2>
          <p class="text-secondary small m-0">Find scholarships, university programs, seminars, and practical attachments.</p>
        </div>
      </div>

      <!-- Filters Row -->
      <div class="card-edu-static p-3 mb-4">
        <div class="row g-3 align-items-center">
          <div class="col-md-3">
            <label class="form-label-edu small mb-1">Search Keywords</label>
            <input type="text" id="opp-search" class="form-control-edu" placeholder="e.g. AI Ethics, Physics, Oxford..." />
          </div>
          <div class="col-md-3">
            <label class="form-label-edu small mb-1">Category</label>
            <select id="opp-category" class="form-select-edu">
              <option value="all">All 9 Categories</option>
              <option value="scholarships">Scholarships</option>
              <option value="classes-courses">Classes & Courses</option>
              <option value="seminars">Seminars</option>
              <option value="workshops">Workshops</option>
              <option value="events">Events</option>
              <option value="internships">Internships</option>
              <option value="volunteer-opportunities">Volunteer Opportunities</option>
              <option value="competitions">Competitions</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label-edu small mb-1">Status</label>
            <select id="opp-status" class="form-select-edu">
              <option value="all">All Statuses</option>
              <option value="open">Open</option>
              <option value="closing_soon">Closing Soon (&le; 7 days)</option>
              <option value="upcoming">Upcoming</option>
              <option value="closed">Closed</option>
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label-edu small mb-1">Delivery Mode</label>
            <select id="opp-delivery-mode" class="form-select-edu">
              <option value="all">All Modes</option>
              <option value="online">Online / Remote</option>
              <option value="in_person">In-Person Campus</option>
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label-edu small mb-1">Urgency</label>
            <select id="opp-urgency" class="form-select-edu">
              <option value="all">All Deadlines</option>
              <option value="closing_soon">Closing within 7 days</option>
              <option value="this_month">Closing this month</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Opportunities Grid -->
      <div class="row" id="opportunities-grid">
        <!-- Injected via JavaScript -->
      </div>
    </div>
  </main>

  <div id="edu-toast-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/educonnect/assets/js/api.js"></script>
  <script src="/educonnect/assets/js/opportunities.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Pre-select category or search from URL if present
      const urlParams = new URLSearchParams(window.location.search);
      const cat = urlParams.get('category');
      const search = urlParams.get('search');
      if (cat) {
        const catSelect = document.getElementById('opp-category');
        if (catSelect) catSelect.value = cat;
      }
      if (search) {
        const sInput = document.getElementById('opp-search');
        if (sInput) sInput.value = search;
      }
      EduOpportunities.initDirectory();
    });
  </script>
</body>
</html>
