<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Applications - EduConnect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/educonnect/assets/css/style.css" />
  <link rel="stylesheet" href="/educonnect/assets/css/responsive.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-edu" id="edu-main-nav"></nav>

  <main class="py-5">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="fw-bold m-0">My Applications & Expressed Interests</h2>
          <p class="text-secondary small m-0">Track the status of your applications submitted across universities and providers.</p>
        </div>
        <a href="/educonnect/pages/opportunities.html" class="btn-edu-primary btn-edu-sm">+ Explore Opportunities</a>
      </div>

      <div class="card-edu p-4">
        <div class="table-responsive-custom">
          <table class="table table-hover align-middle mb-0">
            <thead>
              <tr class="table-light">
                <th>Opportunity</th>
                <th>Provider / Host</th>
                <th>Application Type</th>
                <th>Submitted Date</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="learner-apps-tbody">
              <tr><td colspan="6" class="text-center py-4 text-muted">Loading your submitted applications...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <div id="edu-toast-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/educonnect/assets/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      EduApi.renderNav('learner-applications');
      const auth = EduApi.getAuth();
      if (!auth || !auth.user || auth.user.role !== 'learner') {
        window.location.href = '/educonnect/login.html';
        return;
      }
      loadApplications();
    });

    async function loadApplications() {
      const container = document.getElementById('learner-apps-tbody');
      const res = await EduApi.request('applications/index.php');

      if (res.success && res.data) {
        if (res.data.length === 0) {
          container.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-muted">You haven't submitted any applications yet.</td></tr>`;
          return;
        }

        container.innerHTML = res.data.map(a => {
          const isPending = a.status === 'pending';
          const isReview = a.status === 'under_review';
          const isAccepted = a.status === 'accepted';
          const isRejected = a.status === 'rejected';

          return `
          <tr>
            <td>
              <strong>${a.opportunity_title}</strong>
              <div class="small text-muted">${a.category_name}</div>
              <!-- Visual Application Status Stepper -->
              <div class="app-timeline" style="max-width: 320px;">
                <div class="app-timeline-step completed">
                  <div class="app-timeline-dot">✓</div>
                  <div class="app-timeline-label">Submitted</div>
                </div>
                <div class="app-timeline-step ${isReview || isAccepted || isRejected ? 'completed' : (isPending ? 'active' : '')}">
                  <div class="app-timeline-dot">${isReview || isAccepted || isRejected ? '✓' : '2'}</div>
                  <div class="app-timeline-label">In Review</div>
                </div>
                <div class="app-timeline-step ${isAccepted ? 'completed' : (isRejected ? 'rejected' : (isReview ? 'active' : ''))}">
                  <div class="app-timeline-dot">${isAccepted ? '★' : (isRejected ? '✕' : '3')}</div>
                  <div class="app-timeline-label">${isRejected ? 'Declined' : 'Decision'}</div>
                </div>
              </div>
            </td>
            <td>${a.university_name || a.provider_name}</td>
            <td><span class="badge bg-light text-dark border">${a.application_type === 'express_interest' ? 'Expressed Interest' : 'EduConnect Profile'}</span></td>
            <td class="small text-muted">${new Date(a.submitted_at).toLocaleDateString()}</td>
            <td><span class="badge-status ${a.status}">${a.status.replace('_', ' ')}</span></td>
            <td>
              <div class="d-flex gap-2">
                <a href="/educonnect/pages/opportunity-details.html?id=${a.opportunity_id}" class="btn-edu-secondary btn-edu-sm">View Opportunity</a>
                ${a.status === 'pending' ? `<button class="btn btn-sm text-danger" onclick="withdrawApp(${a.id})">Withdraw</button>` : ''}
              </div>
            </td>
          </tr>
        `;
        }).join('');
      }
    }

    async function withdrawApp(id) {
      if (!confirm('Are you sure you want to withdraw this application?')) return;
      const res = await EduApi.request('applications/status.php', {
        method: 'POST',
        body: JSON.stringify({ application_id: id, action: 'withdraw' })
      });
      if (res.success) {
        EduApi.showToast('Application withdrawn successfully.', 'info');
        loadApplications();
      } else {
        EduApi.showToast(res.message, 'error');
      }
    }
  </script>
</body>
</html>
