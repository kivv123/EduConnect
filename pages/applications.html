<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="educonnect.jpg">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Applications - EduConnect</title>
  <meta name="description" content="Track your submitted scholarship and program applications in real-time." />

  <!-- Bootstrap 5.3.3 CSS & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <!-- Custom Styles -->
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
</head>
<body class="bg-light">

  <!-- Dynamic Navigation Bar -->
  <div id="mainNavbar"></div>

  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-9">
          
          <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
            <div>
              <nav aria-label="breadcrumb">
                <ol class="breadcrumb text-xs mb-1">
                  <li class="breadcrumb-item"><a href="../index.html" class="text-decoration-none">Home</a></li>
                  <li class="breadcrumb-item"><a href="learner-dashboard.html" class="text-decoration-none">Dashboard</a></li>
                  <li class="breadcrumb-item active" aria-current="page">Applications</li>
                </ol>
              </nav>
              <h1 class="h3 fw-bold text-dark mb-1">My Submitted Applications</h1>
              <p class="text-secondary small mb-0">Monitor your admission reviews, scholarship decisions, and submitted portfolios.</p>
            </div>

            <div class="d-flex align-items-center gap-2">
              <label class="text-xs text-muted mb-0">Status:</label>
              <select class="form-select form-select-sm" id="applicationStatusFilter" style="width: 160px;">
                <option value="all">All Applications</option>
                <option value="pending">Pending</option>
                <option value="under_review">Under Review</option>
                <option value="accepted">Accepted</option>
                <option value="rejected">Not Selected</option>
              </select>
            </div>
          </div>

          <!-- Applications List Container -->
          <div id="applicationsListContainer">
            <!-- Populated via js/pages/applications.js -->
          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- Dynamic Footer -->
  <div id="mainFooter"></div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Script Pipeline -->
  <script src="../js/data/mock-users.js"></script>
  <script src="../js/data/mock-categories.js"></script>
  <script src="../js/data/mock-opportunities.js"></script>
  <script src="../js/data/mock-universities.js"></script>
  <script src="../js/data/mock-events.js"></script>
  <script src="../js/data/mock-applications.js"></script>

  <script src="../js/core/config.js"></script>
  <script src="../js/core/storage.js"></script>
  <script src="../js/core/router.js"></script>
  <script src="../js/services/auth-service.js"></script>
  <script src="../js/services/user-service.js"></script>
  <script src="../js/services/opportunity-service.js"></script>
  <script src="../js/services/university-service.js"></script>
  <script src="../js/services/event-service.js"></script>
  <script src="../js/services/application-service.js"></script>

  <script src="../js/core/app.js"></script>
  <script src="../js/pages/applications.js"></script>
</body>
</html>
