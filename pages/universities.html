<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accredited Universities - EduConnect</title>
  <meta name="description" content="Discover and compare top collegiate and research universities worldwide." />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/educonnect/assets/css/style.css" />
  <link rel="stylesheet" href="/educonnect/assets/css/responsive.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-edu" id="edu-main-nav"></nav>

  <main class="py-5">
    <div class="container">
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-4 gap-3">
        <div>
          <h2 class="fw-bold m-0">Accredited Global Universities</h2>
          <p class="text-secondary small m-0">Browse higher education institutions, review verified accreditations, and compare metrics.</p>
        </div>
        <div class="d-flex gap-2">
          <a href="/educonnect/pages/university-intakes.html" class="btn-edu-secondary btn-edu-sm">View All Intakes</a>
          <a href="/educonnect/pages/university-scholarships.html" class="btn-edu-secondary btn-edu-sm">View Scholarships</a>
        </div>
      </div>

      <!-- Filters Row -->
      <div class="card-edu-static p-3 mb-4">
        <div class="row g-3 align-items-center">
          <div class="col-md-4">
            <label class="form-label-edu small mb-1">Search by Name or City</label>
            <input type="text" id="search-input" class="form-control-edu" placeholder="e.g. Oxford, MIT, Cambridge..." />
          </div>
          <div class="col-md-3">
            <label class="form-label-edu small mb-1">Country</label>
            <select id="country-select" class="form-select-edu">
              <option value="">All Countries</option>
              <option value="United Kingdom">United Kingdom</option>
              <option value="United States">United States</option>
              <option value="Canada">Canada</option>
              <option value="Australia">Australia</option>
              <option value="Singapore">Singapore</option>
              <option value="Germany">Germany</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label-edu small mb-1">QS World Ranking</label>
            <select id="ranking-select" class="form-select-edu">
              <option value="">Any Ranking</option>
              <option value="10">Top 10 Global</option>
              <option value="50">Top 50 Global</option>
              <option value="100">Top 100 Global</option>
              <option value="500">Top 500 Global</option>
            </select>
          </div>
          <div class="col-md-2 d-flex align-items-end">
            <div class="form-check mt-3 mt-md-0">
              <input class="form-check-input" type="checkbox" id="scholarships-check" />
              <label class="form-check-label small fw-semibold" for="scholarships-check">
                Has Scholarships
              </label>
            </div>
          </div>
        </div>
      </div>

      <!-- Universities Grid -->
      <div class="row" id="universities-grid">
        <!-- Injected via JavaScript -->
      </div>
    </div>
  </main>

  <div id="edu-toast-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/educonnect/assets/js/api.js"></script>
  <script src="/educonnect/assets/js/universities.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      EduUniversities.initDirectory();
    });
  </script>
</body>
</html>
