<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>University Scholarships & Grants - EduConnect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/educonnect/assets/css/style.css" />
  <link rel="stylesheet" href="/educonnect/assets/css/responsive.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-edu" id="edu-main-nav"></nav>

  <main class="py-5">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="fw-bold m-0">University Scholarships & Fellowships</h2>
          <p class="text-secondary small m-0">Academic excellence awards, research grants, and fully funded fellowships.</p>
        </div>
        <a href="/educonnect/pages/universities.html" class="btn-edu-secondary btn-edu-sm">All Universities</a>
      </div>

      <div class="row" id="scholarships-grid">
        <div class="col-12 state-box">
          <div class="spinner-border text-primary mb-2" role="status"></div>
          <p class="text-muted m-0">Fetching scholarship programs...</p>
        </div>
      </div>
    </div>
  </main>

  <div id="edu-toast-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/educonnect/assets/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      EduApi.renderNav('universities');
      const container = document.getElementById('scholarships-grid');
      // Category 1 is Scholarships
      const res = await EduApi.request('opportunities/index.php?category_id=1');

      if (res.success && res.data && res.data.length > 0) {
        container.innerHTML = res.data.map(s => `
          <div class="col-md-6 col-lg-4 mb-4">
            <div class="card-edu p-4 h-100 d-flex flex-column">
              <div class="d-flex justify-content-between align-items-start mb-2">
                <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-2 py-1 small rounded-pill">Scholarship</span>
                <span class="badge-status ${s.status}">${s.status.replace('_', ' ')}</span>
              </div>
              <h5 class="fw-bold mb-1">${s.title}</h5>
              <p class="small text-muted mb-2"><strong>${s.university_name || s.provider_name}</strong> ${s.university_is_verified ? '<span class="badge-verified ms-1">Verified ✓</span>' : ''}</p>
              <p class="text-secondary small mb-3 flex-grow-1" style="display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;">${s.description}</p>
              <div class="pt-2 border-top d-flex justify-content-between align-items-center mt-auto">
                <span class="small text-danger fw-semibold">Deadline: ${s.application_deadline}</span>
                <a href="/educonnect/pages/opportunity-details.html?id=${s.id}" class="btn-edu-primary btn-edu-sm">View & Apply</a>
              </div>
            </div>
          </div>
        `).join('');
      } else {
        container.innerHTML = `<div class="col-12 state-box">No open scholarships at the moment.</div>`;
      }
    });
  </script>
</body>
</html>
