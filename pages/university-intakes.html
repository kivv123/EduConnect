<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>University Admissions & Intakes - EduConnect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/educonnect/assets/css/style.css" />
  <link rel="stylesheet" href="/educonnect/assets/css/responsive.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-edu" id="edu-main-nav"></nav>

  <main class="py-5">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="fw-bold m-0">University Admissions Intakes</h2>
          <p class="text-secondary small m-0">Academic terms, application deadlines, and portal application links.</p>
        </div>
        <a href="/educonnect/pages/universities.html" class="btn-edu-secondary btn-edu-sm">Universities Directory</a>
      </div>

      <div class="row" id="intakes-list-grid">
        <div class="col-12 state-box">
          <div class="spinner-border text-primary mb-2" role="status"></div>
          <p class="text-muted m-0">Fetching upcoming intakes...</p>
        </div>
      </div>
    </div>
  </main>

  <div id="edu-toast-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/educonnect/assets/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      EduApi.renderNav('universities');
      const container = document.getElementById('intakes-list-grid');
      const res = await EduApi.request('universities/intakes.php');

      if (res.success && res.data && res.data.length > 0) {
        container.innerHTML = res.data.map(i => `
          <div class="col-md-6 mb-4">
            <div class="card-edu p-4 h-100 d-flex flex-column">
              <div class="d-flex justify-content-between align-items-start mb-2">
                <div>
                  <h4 class="fw-bold m-0">${i.intake_name}</h4>
                  <p class="text-muted small mb-0">${i.university_name} 📍 ${i.city || ''}, ${i.country || ''} ${i.is_verified ? '• <span class="badge-verified">Verified ✓</span>' : ''}</p>
                </div>
                <span class="badge-status open">Open</span>
              </div>
              <div class="my-3 p-3 bg-light rounded-3 small">
                <div class="row">
                  <div class="col-6"><strong>Term Starts:</strong><br>${i.start_date}</div>
                  <div class="col-6 text-danger"><strong>Application Deadline:</strong><br>${i.application_deadline}</div>
                </div>
              </div>
              <p class="text-secondary small mb-4 flex-grow-1">${i.description}</p>
              <div class="d-flex gap-2 mt-auto">
                <a href="/educonnect/pages/university-details.html?id=${i.university_id}" class="btn-edu-secondary btn-edu-sm flex-grow-1">University Info</a>
                ${i.application_url ? `<a href="${i.application_url}" target="_blank" rel="noopener" class="btn-edu-primary btn-edu-sm">Apply on Portal ↗</a>` : ''}
              </div>
            </div>
          </div>
        `).join('');
      } else {
        container.innerHTML = `<div class="col-12 state-box">No published intakes found.</div>`;
      }
    });
  </script>
</body>
</html>
