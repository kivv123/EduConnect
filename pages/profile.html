<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="educonnect.jpg">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Profile - EduConnect</title>
  <meta name="description" content="View and manage your EduConnect account settings, credentials, and profile information." />

  <!-- Bootstrap 5.3.3 CSS & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <!-- Custom Styles -->
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
</head>
<body class="bg-light">

  <!-- Dynamic Navigation Bar -->
  <div id="mainNavbar"></div>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        
        <!-- Profile Header Card -->
        <div class="card border shadow-sm rounded-4 mb-4 overflow-hidden bg-white">
          <div class="bg-primary p-4 text-white position-relative" style="min-height: 120px;">
            <div class="position-absolute bottom-0 start-0 m-4 d-flex align-items-center gap-3">
              <img id="profileAvatar" src="" class="rounded-circle border border-3 border-white shadow-sm bg-white" width="80" height="80" style="object-fit: cover;">
              <div class="text-white" style="margin-top: 24px;">
                <h4 class="fw-bold mb-0" id="profileHeaderName">User Profile</h4>
                <div class="d-flex align-items-center gap-2 mt-1">
                  <span class="badge bg-light text-dark" id="profileHeaderRole">Learner</span>
                  <span class="small text-white text-opacity-75" id="profileHeaderEmail">user@example.com</span>
                </div>
              </div>
            </div>
          </div>
          <div class="card-body p-4 pt-5 mt-2">
            <div class="d-flex justify-content-between align-items-center text-xs text-muted border-top pt-3">
              <span id="profileCreatedAt">Member since 2025</span>
              <span><i class="bi bi-shield-check text-success me-1"></i>Verified Identity</span>
            </div>
          </div>
        </div>

        <!-- Profile Edit Form -->
        <div class="card border shadow-sm rounded-4 bg-white">
          <div class="card-header bg-white border-bottom p-3.5">
            <h5 class="fw-bold text-dark mb-0 fs-6">Personal & Academic Details</h5>
          </div>
          <div class="card-body p-4">
            <form id="profileEditForm">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label small fw-semibold text-dark">Full Name</label>
                  <input type="text" class="form-control" id="inputName" required>
                </div>

                <div class="col-md-6">
                  <label class="form-label small fw-semibold text-dark">Email Address (Read-only)</label>
                  <input type="email" class="form-control bg-light" id="inputEmail" readonly>
                </div>

                <div class="col-md-6">
                  <label class="form-label small fw-semibold text-dark">Contact Phone</label>
                  <input type="tel" class="form-control" id="inputPhone" placeholder="+1 (555) 000-0000">
                </div>

                <div class="col-md-6">
                  <label class="form-label small fw-semibold text-dark">University, School or Organization</label>
                  <input type="text" class="form-control" id="inputOrg" placeholder="e.g. Stanford University">
                </div>

                <div class="col-md-12">
                  <label class="form-label small fw-semibold text-dark">Profile Picture URL</label>
                  <input type="url" class="form-control" id="inputAvatar" placeholder="https://...">
                  <div class="form-text text-xs">Direct image URL to preview on avatar.</div>
                </div>

                <div class="col-md-12">
                  <label class="form-label small fw-semibold text-dark">Bio / Academic Interests</label>
                  <textarea class="form-control" id="inputBio" rows="3" placeholder="Tell institutions about your research interests, majors, and career focus..."></textarea>
                </div>
              </div>

              <div class="mt-4 pt-3 border-top d-flex justify-content-between align-items-center">
                <span class="text-xs text-muted"><i class="bi bi-info-circle me-1"></i>Changes persist to browser state and sync with PHP API.</span>
                <button type="submit" class="btn btn-primary px-4 fw-semibold">
                  Save Changes
                </button>
              </div>
            </form>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Dynamic Footer -->
  <div id="mainFooter"></div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Scripts -->
  <script src="../js/data/mock-users.js"></script>
  <script src="../js/data/mock-categories.js"></script>
  <script src="../js/data/mock-opportunities.js"></script>
  <script src="../js/data/mock-universities.js"></script>
  <script src="../js/data/mock-events.js"></script>
  <script src="../js/data/mock-applications.js"></script>

  <script src="../js/core/config.js"></script>
  <script src="../js/core/storage.js"></script>
  <script src="../js/core/router.js"></script>
  <script src="../js/services/auth-service.js"></script>
  <script src="../js/services/user-service.js"></script>
  <script src="../js/services/opportunity-service.js"></script>
  <script src="../js/services/university-service.js"></script>
  <script src="../js/services/event-service.js"></script>
  <script src="../js/services/application-service.js"></script>

  <script src="../js/core/app.js"></script>
  <script src="../js/pages/profile.js"></script>
</body>
</html>
